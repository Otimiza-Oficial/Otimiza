[package]
name = "pc-optimizer"
version = "0.21.0"
description = "Console de desempenho para Windows"
authors = ["Otimiza"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pc_optimizer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
num_cpus = "1.16"
chrono = "0.4"

# Assinatura de licença.
#
# O produto guarda só a chave PÚBLICA, que consegue conferir uma assinatura e
# não consegue criar nenhuma. Extrair essa chave do executável não permite
# forjar licença — é ter a fechadura sem a chave.
#
# `default-features = false` deixa de fora a geração de chave aleatória, que só
# a ferramenta de emitir licença precisa. O que vai para o cliente carrega
# apenas o necessário para conferir.
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
base64 = "0.22"
sysinfo = "0.33"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
# Já vem na árvore por causa do winreg e do Tauri. Usado só para perguntar ao
# Windows se o processo está elevado — a única resposta confiável.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    # Rastreamento de eventos do Windows. Usado para contar quadros
    # apresentados por um jogo sem injetar nada no processo dele.
    "Win32_System_Diagnostics_Etw",
    # Exigida pela estrutura de sessão do ETW, que carrega fuso horário.
    "Win32_System_Time",
    # Frequência do contador de alta resolução, para converter o carimbo de
    # tempo de cada quadro em milissegundos.
    "Win32_System_Performance",
    # Descobrir qual janela está em primeiro plano e quanto do monitor ela
    # cobre — metade da detecção de jogo sem lista de nomes.
    "Win32_UI_WindowsAndMessaging",
    # Ler e mudar o modo de vídeo: resolução e taxa de atualização do monitor.
    # É onde moram `DEVMODEW` e `EnumDisplaySettingsExW`.
    "Win32_Graphics_Gdi",
    # Percorrer as threads de um processo para suspendê-lo durante o jogo.
    # O Windows não expõe "suspender processo" em API pública documentada: a
    # forma suportada é suspender cada thread, e é preciso listar as threads
    # para isso.
    "Win32_System_Diagnostics_ToolHelp",
] }


# A ferramenta que EMITE licença vive em `examples/gerar_chave.rs`.
#
# Exemplo, e não binário, por um motivo de segurança: `cargo build --release`
# NÃO compila exemplos, então essa ferramenta nunca entra no instalador. Ela é
# a única peça do projeto que toca na chave privada.
#
# Rodar com:  cargo run --example gerar_chave -- ...
[dev-dependencies]
# Só para sortear a chave privada, uma vez na vida. Fica em dev-dependencies
# porque o produto não precisa de aleatoriedade — conferir assinatura é
# determinístico.
getrandom = "0.2"
