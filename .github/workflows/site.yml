# Publicação do site
#
# Compila o site (`web/`, Next.js exportado como arquivos estáticos) e publica
# no GitHub Pages, em https://otimiza-oficial.github.io/Otimiza/
#
# O site anterior (`site/`, Astro) saiu do ar nesta troca. O código dele segue
# no repositório; para voltar a publicá-lo, é só apontar este arquivo de novo
# para `site/`.
#
# SÓ RODA QUANDO O SITE MUDA
#
# O filtro de caminho existe porque a maior parte dos commits deste repositório
# é do aplicativo, não do site. Sem ele, cada mudança em Rust gastaria minuto de
# esteira republicando uma página idêntica — e, pior, encheria o histórico de
# publicações de ruído, deixando difícil achar quando o site mudou de verdade.
#
# POR QUE NÃO PUBLICA A BRANCH
#
# Só a `main`. Publicar branch de trabalho colocaria no ar texto de venda ainda
# em revisão, no mesmo endereço que o cliente acessa.
#
# UM PASSO MANUAL, E POR QUE ELE NÃO DÁ PARA AUTOMATIZAR
#
# Em Settings → Pages, a origem precisa ser **GitHub Actions**. É uma vez na
# vida do repositório — e já foi feito para o site anterior.
#
# `enablement: true` tenta criar o Pages pela API, mas `POST /repos/{owner}/{repo}/pages`
# exige permissão de ADMINISTRADOR, que o GITHUB_TOKEN das Actions não recebe.
# Quando o Pages já existe, a ação nem chama a API.

name: Publicar site

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/site.yml"
  # Permite republicar sem precisar de commit — útil para reverter uma
  # publicação ruim.
  workflow_dispatch:

# `pages` e `id-token` são o que o deploy-pages exige; `contents: read` é o
# mínimo para clonar. Nada aqui escreve no repositório.
permissions:
  contents: read
  pages: write
  id-token: write

# Duas publicações ao mesmo tempo se atropelam e a última a terminar vence —
# que pode ser a mais antiga. Uma de cada vez, e sem cancelar a que já está no
# ar: `cancel-in-progress: false` evita interromper um deploy pela metade.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  compilar:
    name: Compilar o site
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependências
        working-directory: web
        run: npm ci

      # O lint roda antes do build porque o `next build` não roda mais o ESLint
      # sozinho nesta versão do Next.
      - name: Conferir o código
        working-directory: web
        run: npm run lint

      # O site mora na subpasta /Otimiza. Sem PAGES_BASE_PATH, os links e os
      # arquivos apontariam para a raiz do domínio e a página abriria sem
      # estilo, sem logo e sem imagens.
      - name: Compilar
        working-directory: web
        env:
          PAGES_BASE_PATH: /Otimiza
        run: npm run build

      # O Pages procura `404.html` na raiz; o Next exporta em `404/index.html`.
      # A cópia acontece DEPOIS do carimbo da política (que roda no postbuild),
      # então o 404 sai com a mesma política das outras páginas.
      - name: Página de não encontrado
        working-directory: web
        run: cp out/404/index.html out/404.html

      # A política de conteúdo é a única defesa contra script injetado num site
      # estático — e ela é escrita por um passo que alguém pode remover sem
      # perceber. Aqui a falta dela reprova a publicação.
      - name: Conferir a política de conteúdo em toda página
        working-directory: web
        run: |
          set -euo pipefail
          sem=$(grep -rLE 'http-equiv="Content-Security-Policy"' out --include=*.html || true)
          if [ -n "$sem" ]; then
            echo "Páginas sem política de conteúdo:"
            echo "$sem"
            exit 1
          fi
          # Só o trecho do script-src: o style-src TEM unsafe-inline de propósito
          # (animação escreve style no elemento), e um padrão que atravessa o
          # ponto e vírgula acusaria isso como defeito.
          if grep -rhoE "script-src[^;\"]*" out --include=*.html | grep -q "unsafe-inline"; then
            echo "A política liberou script em linha — isso anula a proteção."
            exit 1
          fi
          echo "Política presente em todas as páginas, sem 'unsafe-inline' em script."

      - name: Conferir que as páginas saíram
        working-directory: web
        run: |
          set -euo pipefail
          for pagina in "" entrar boas-vindas comecar painel painel/licencas painel/downloads painel/suporte painel/conta; do
            arquivo="out/${pagina:+$pagina/}index.html"
            if [ ! -f "$arquivo" ]; then
              echo "Faltou a página: /${pagina}"
              exit 1
            fi
          done
          echo "As nove páginas foram geradas."

      - name: Conferir que o instalador continua linkado
        working-directory: web
        run: |
          set -euo pipefail
          if ! grep -q "releases/latest/download/Otimiza-instalador.exe" out/index.html; then
            echo "O link do instalador sumiu da página inicial."
            echo "Sem ele o funil não existe: o código da máquina só aparece depois de instalar."
            exit 1
          fi
          echo "Link do instalador presente."

      # Rede de segurança contra o defeito mais provável de um site em subpasta:
      # um caminho escrito na mão sem o basePath funciona no computador e quebra
      # no ar. Aqui ele falha na esteira, não no navegador do cliente.
      - name: Conferir que nenhum caminho interno perdeu o /Otimiza
        working-directory: web
        run: |
          set -euo pipefail
          ruins=$(grep -rhoE '(href|src)="/[^"]*"|url\(/[^)]*\)' out --include=*.html \
            | grep -vE '"/Otimiza/|\(/Otimiza/' | sort -u || true)
          if [ -n "$ruins" ]; then
            echo "Caminhos sem o /Otimiza:"
            echo "$ruins"
            exit 1
          fi
          echo "Todos os caminhos internos têm o /Otimiza."

      - name: Preparar o Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Enviar o artefato
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/out

  publicar:
    name: Publicar
    needs: compilar
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}

    steps:
      - name: Publicar no GitHub Pages
        id: publicacao
        uses: actions/deploy-pages@v5
