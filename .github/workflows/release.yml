# Publicação de versões
#
# Dispara ao empurrar uma tag `v*` — por exemplo `v0.2.0`. O GitHub compila os
# instaladores em máquina limpa e anexa ao release, o que também serve de prova
# de que o projeto compila fora do PC de quem desenvolve.
#
# SOBRE MACOS E LINUX
#
# Os blocos das duas plataformas estão prontos abaixo, mas desligados de
# propósito. Todo o motor de otimização é exclusivo do Windows: fora dele o
# aplicativo abre, mostra painéis vazios e responde "não implementado" em cada
# botão. Publicar esses instaladores seria entregar um programa que não faz nada
# carregando a marca Otimiza.
#
# Para ligar, quando existir motor para a plataforma: mova a entrada
# correspondente de `nao_publicadas` para `matrix.include`.

name: Publicar versão

on:
  push:
    tags:
      - "v*"
  # Permite disparar manualmente pela aba Actions, para testar sem criar tag.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    name: Compilar em ${{ matrix.plataforma }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            plataforma: Windows
            alvo: ""

          # Prontas para uso, aguardando motor de otimização próprio:
          #
          # nao_publicadas:
          #   - runner: macos-latest    → precisa de assinatura e notarização da Apple
          #   - runner: ubuntu-22.04    → precisa de libwebkit2gtk-4.1-dev e patchelf

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      # ---------------------------------------------------------------------
      # AS NOTAS PRECISAM FALAR DESTA VERSÃO.
      #
      # `.github/release-notes.md` é o texto que vai para a página da versão e,
      # a partir de agora, para o anúncio que o bot publica no Discord. Ele é um
      # arquivo fixo: se ninguém atualizar, a versão nova sai contando a
      # história da antiga.
      #
      # Foi o que aconteceu. Da 0.18 à 0.27 todas as publicações saíram com o
      # texto da 0.17 — inclusive a tabela que manda baixar
      # `Otimiza_0.17.0_x64-setup.exe`, um arquivo que não existe nelas. Dez
      # versões com a instrução errada, e ninguém percebeu porque nada quebra:
      # o instalador certo está lá do lado, e o texto errado é só texto.
      #
      # Esta guarda roda ANTES de compilar, de propósito. Descobrir isto depois
      # de dez minutos de build, com a tag já empurrada, seria pagar caro por um
      # erro que se vê em um segundo.
      #
      # A regra é mínima: as notas têm que citar o número desta versão. Não
      # tenta julgar se o texto está bom — isso é trabalho de quem escreve.
      # ---------------------------------------------------------------------
      - name: Conferir se as notas falam desta versão
        shell: bash
        run: |
          set -euo pipefail

          notas=.github/release-notes.md
          versao="${GITHUB_REF_NAME#v}"

          if [ ! -s "$notas" ]; then
            echo "::error::$notas está vazio ou não existe."
            exit 1
          fi

          if ! grep -qF "$versao" "$notas"; then
            echo "::error::As notas de versão não mencionam $versao."
            echo ""
            echo "  $notas é o texto que vai para a página da versão e para o"
            echo "  anúncio no Discord. Ele não muda sozinho: sem atualizar,"
            echo "  esta versão sai contando a história da anterior."
            echo ""
            echo "  Versões citadas hoje no arquivo:"
            grep -oE '[0-9]+\.[0-9]+\.[0-9]+' "$notas" | sort -u | sed 's/^/    /' || echo "    (nenhuma)"
            echo ""
            echo "  Atualize o arquivo, faça o commit, apague a tag e crie de novo."
            exit 1
          fi

          echo "As notas mencionam $versao."

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pc-optimizer/package-lock.json

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Reaproveitar compilações anteriores
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: pc-optimizer/src-tauri

      - name: Instalar dependências do frontend
        working-directory: pc-optimizer
        run: npm ci

      - name: Conferir tipos do frontend
        working-directory: pc-optimizer
        run: npx tsc --noEmit

      # Os testes rodam antes de empacotar: versão que não passa não vira
      # instalador. E rodam SEPARADOS POR ÁREA de propósito — o log detalhado só
      # é acessível com autenticação, então a divisão em passos faz o próprio
      # painel apontar onde quebrou.
      #
      # Sem `continue-on-error` de propósito: com ele o resultado do passo é
      # reescrito para "sucesso" e o painel passa a mentir sobre o que aconteceu.
      # Parar no primeiro erro mostra menos de uma vez, mas mostra a verdade.
      - name: Testes — núcleo e dados
        working-directory: pc-optimizer/src-tauri
        run: "cargo test --lib -- ci_coverage:: core:: modules::atualizacao:: modules::changelog:: modules::preferences:: modules::prova:: modules::safety:: modules::windows::cbslog:: modules::windows::reparo::"

      - name: Testes — licença e comandos
        working-directory: pc-optimizer/src-tauri
        run: "cargo test --lib -- commands:: modules::licenca:: modules::maquina::"

      - name: Testes — medição
        working-directory: pc-optimizer/src-tauri
        run: "cargo test --lib -- modules::benchmark:: modules::jitter::"

      - name: Testes — catálogo e serviços
        working-directory: pc-optimizer/src-tauri
        run: "cargo test --lib -- modules::windows::catalog:: modules::windows::power:: modules::windows::services:: modules::windows::startup::"

      - name: Testes — registro
        working-directory: pc-optimizer/src-tauri
        run: "cargo test --lib -- modules::windows::registry::"

      - name: Testes — dispositivos
        working-directory: pc-optimizer/src-tauri
        run: "cargo test --lib -- modules::windows::devices::"

      - name: Testes — perfil de hardware
        working-directory: pc-optimizer/src-tauri
        run: "cargo test --lib -- modules::windows::hardware::"

      - name: Testes — sistema e limpeza
        working-directory: pc-optimizer/src-tauri
        run: "cargo test --lib -- modules::windows::cleanup:: modules::windows::processes:: modules::windows::restore:: modules::windows::firmware:: modules::windows::suspend:: modules::windows::anticheat:: modules::windows::sessao:: modules::windows::suporte::"

      - name: Testes — espaço e memória
        working-directory: pc-optimizer/src-tauri
        run: "cargo test --lib -- modules::windows::diskspace:: modules::windows::memory::"

      # O veredito é o que a tela inicial mostra antes de qualquer botão. Fica
      # em passo próprio porque é a área que decide o que o cliente lê primeiro:
      # quebra aqui é quebra na primeira impressão do produto.
      - name: Testes — veredito da máquina
        working-directory: pc-optimizer/src-tauri
        run: "cargo test --lib -- modules::windows::achados:: modules::windows::veredito:: modules::windows::exhaustion:: modules::windows::pressao:: modules::windows::display:: modules::windows::gpupref:: modules::windows::configjogo::"

      - name: Testes — conflitos, tarefas e programas de fábrica
        working-directory: pc-optimizer/src-tauri
        run: "cargo test --lib -- modules::windows::conflicts:: modules::windows::tasks:: modules::windows::bloatware:: modules::windows::tarefa_longa::"

      - name: Testes — inicialização e limitação do processador
        working-directory: pc-optimizer/src-tauri
        run: "cargo test --lib -- modules::windows::boot:: modules::windows::thermal:: modules::windows::browsers:: modules::windows::fivem:: modules::windows::citizenfx::"

      - name: Testes — saúde do hardware e relatório
        working-directory: pc-optimizer/src-tauri
        run: "cargo test --lib -- modules::windows::health:: modules::report:: modules::monitor::"

      - name: Testes — serviços de terceiros, perfis e execução
        working-directory: pc-optimizer/src-tauri
        run: "cargo test --lib -- modules::windows::servicesaudit:: modules::windows::profiles:: modules::windows::shell:: modules::windows::network:: modules::windows::rede:: modules::windows::frames:: modules::windows::gamemode:: modules::windows::deteccao:: modules::windows::jogos:: modules::windows::bottleneck:: modules::windows::shaders:: modules::windows::readiness::"

      # O mapa de pastas varre o disco de verdade e leva perto de um minuto.
      # Fica num passo próprio para não parecer que outra área travou.
      - name: Testes — mapa de pastas
        working-directory: pc-optimizer/src-tauri
        run: "cargo test --lib -- modules::windows::foldermap::"

      - name: Testes — motor de otimização
        working-directory: pc-optimizer/src-tauri
        run: "cargo test --lib -- modules::windows::tests::"

      # A descrição vive num arquivo versionado, não escondida no YAML: assim ela
      # passa por revisão como qualquer outro texto do produto.
      - name: Ler a descrição da versão
        id: notas
        shell: bash
        run: |
          {
            echo 'corpo<<FIM_DAS_NOTAS'
            cat .github/release-notes.md
            echo FIM_DAS_NOTAS
          } >> "$GITHUB_OUTPUT"

      - name: Compilar e publicar
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: pc-optimizer
          tagName: ${{ github.ref_name }}
          releaseName: Otimiza ${{ github.ref_name }}
          releaseBody: ${{ steps.notas.outputs.corpo }}
          # Publica direto, sem passar por rascunho. A descrição já vem revisada
          # de `.github/release-notes.md`, que é versionado e passa por revisão
          # como qualquer outro texto do produto — o rascunho seria uma segunda
          # conferência do que já foi conferido.
          #
          # Para voltar a revisar antes de publicar, trocar para `true`.
          releaseDraft: false
          prerelease: false

      # ---------------------------------------------------------------------
      # UMA CÓPIA COM NOME FIXO, PARA O LINK QUE O BOT MANDA NUNCA ENVELHECER.
      #
      # Os instaladores saem com a versão no nome — `Otimiza_0.26.0_x64-setup.exe`
      # —, e é assim que deve ser: quem baixa sabe o que baixou. Mas isso torna
      # impossível ter um endereço fixo de download, porque o nome muda a cada
      # publicação.
      #
      # A alternativa era mandar o cliente para a PÁGINA do release, e ali ele
      # encontra dois arquivos parecidos (.exe e .msi) mais os códigos-fonte, e
      # tem que adivinhar qual serve. Numa etapa de compra, cada escolha que a
      # pessoa não sabe fazer é uma desistência possível.
      #
      # Com esta cópia, o endereço abaixo vale para sempre e baixa direto o
      # instalador da versão mais nova:
      #
      #   github.com/Otimiza-Oficial/Otimiza/releases/latest/download/Otimiza-instalador.exe
      #
      # É esse o link que o bot manda para quem vai comprar. Se este passo
      # deixar de rodar, aquele link quebra — por isso ele falha alto quando não
      # acha o arquivo, em vez de seguir em silêncio.
      - name: Publicar cópia de nome fixo para o link do bot
        if: matrix.plataforma == 'Windows'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # `ls` com glob, e não `find`: no runner do Windows o `find` do sistema
          # tem outra sintaxe e pode vencer o do Git Bash no PATH, dependendo da
          # ordem. O glob é resolvido pelo próprio shell e não tem essa dúvida.
          instalador=$(ls pc-optimizer/src-tauri/target/release/bundle/nsis/*-setup.exe 2>/dev/null | head -1)

          if [ -z "$instalador" ]; then
            echo "Não achei o instalador NSIS. O link fixo do bot ficaria quebrado."
            exit 1
          fi

          cp "$instalador" Otimiza-instalador.exe

          # `--clobber` porque republicar a mesma tag tem que substituir, e não
          # falhar com "asset já existe".
          gh release upload "${{ github.ref_name }}" Otimiza-instalador.exe --clobber
